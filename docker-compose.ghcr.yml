# Deploy the image published to GHCR instead of building from source.
#
#   docker compose -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.ghcr.yml up -d
#
# APP_IMAGE defaults to :latest, which tracks the default branch. Pin a release
# tag in .env for a stable deployment:
#   APP_IMAGE=ghcr.io/shinchven/finance-mcp-server:0.1.0
services:
  app:
    image: ${APP_IMAGE:-ghcr.io/shinchven/finance-mcp-server:latest}
    restart: unless-stopped
    ports:
      - "${PORT:-5173}:5173"
    environment:
      PORT: 5173
      APP_URL: ${APP_URL:-http://localhost:5173}
      DATABASE_URL: postgres://finance_mcp:${POSTGRES_PASSWORD:-finance_mcp}@db:5432/finance_mcp
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET in .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?set ADMIN_EMAILS in .env}
      # Chat assistant providers (optional — set any subset in .env)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # SEC EDGAR requires a contact address in the User-Agent
      SEC_EDGAR_CONTACT_EMAIL: ${SEC_EDGAR_CONTACT_EMAIL:-}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finance_mcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance_mcp}
      POSTGRES_DB: finance_mcp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_mcp -d finance_mcp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
